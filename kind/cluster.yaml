# Local Kavrynt lab. One node is plenty; host ports make the lab usable without port-forwards:
#   http://localhost:3000   Grafana (governance dashboard)
#   http://localhost:9090   Prometheus
#   http://localhost:18080  Kavrynt Gateway - point any MCP client at /mcp/<namespace>.<name>
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kavrynt-lab
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30300
        hostPort: 3000
        listenAddress: "127.0.0.1"
      - containerPort: 30090
        hostPort: 9090
        listenAddress: "127.0.0.1"
      - containerPort: 30880
        hostPort: 18080
        listenAddress: "127.0.0.1"
