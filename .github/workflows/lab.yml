name: Lab

# Every change: lint, unit tests, manifests, Terraform and Trivy, then the whole lab on Kind
# with the pinned released runtime. No Azure access (the Azure Lab workflow does that).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: true

env:
  KIND_VERSION: v0.31.0
  HELM_VERSION: v3.22.0
  TERRAFORM_VERSION: 1.16.5

jobs:
  test:
    name: Lint, unit tests, manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Python as the lab image.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Lab package
        run: make venv

      - name: Lint and unit tests
        run: make test

      - name: Render manifests
        run: make validate

  static:
    name: Terraform and Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Format and validate infra/azure
        run: make tf-check

      # Terraform, Kubernetes manifests and the Dockerfile. Accepted findings are listed with
      # their reasons in .trivyignore.yaml.
      - name: Trivy misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: config
          scan-ref: .
          skip-dirs: lab/.venv,.cache
          tf-vars: infra/azure/terraform.tfvars
          trivyignores: .trivyignore.yaml
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: 1

  lab:
    name: Lab on Kind (released runtime)
    runs-on: ubuntu-24.04
    needs: [test, static]
    timeout-minutes: 25
    env:
      RUNTIME: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          version: ${{ env.KIND_VERSION }}
          install_only: true

      - name: Bring the lab up
        run: bash scripts/lab.sh up

      - name: End-to-end checks
        run: bash scripts/lab.sh check

      - name: Diagnostics
        if: failure()
        run: |
          bash scripts/lab.sh status || true
          kubectl --context kind-kavrynt-lab get events -A --sort-by=.lastTimestamp | tail -60 || true
          kubectl --context kind-kavrynt-lab -n kavrynt-system logs deploy/kavrynt-gateway --tail=100 || true
          kubectl --context kind-kavrynt-lab -n kavrynt-system logs deploy/kavrynt-operator --tail=100 || true
          kubectl --context kind-kavrynt-lab -n lab-agents logs deploy/rogue-agent --tail=30 || true

      - name: Tear down
        if: always()
        run: bash scripts/lab.sh down
