name: Lab Integrations

# Step 3 of 3 of the Azure lab (docs/runbooks/azure-lab.md): what connects the lab to the rest
# of the platform (infra/azure/integrations and cluster/integrations):
#   - secret store: the lab Key Vault (kept across cluster rebuilds) and a workload identity
#     federated with the cluster that is up, wired in with the Key Vault CSI driver;
#   - Kavrynt Cloud dev firewall: checks from inside the cluster that Cloud dev accepts the lab's
#     egress IP (the allowlist itself is kavrynt-platform's DEV_ALLOWED_INGRESS_CIDRS).
#
#   after every manual Azure Lab run on main   follows the cluster: federates and checks a new
#                                              cluster after "up", removes the federation after
#                                              "down"
#   manual run on main, operation "apply"      needs the landing zone and a running cluster
#   manual run on main, operation "destroy"    needs confirm; removes the vault (soft-deleted)
#   manual run on main, operation "plan-only"  plan, nothing applied
#   pull request into main                     plan, read-only
# Re-pointing or removing the federated credential needs no approval (the cluster it trusts was
# approved in Azure Lab); every other change waits for an approver, like the other workflows.

on:
  workflow_run:
    workflows: [Azure Lab]
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - infra/azure/integrations/**
      - cluster/integrations/**
      - .github/workflows/lab-integrations.yml
      - .github/actions/terraform-plan/**
      - .github/actions/require-stack/**
  workflow_dispatch:
    inputs:
      operation:
        description: apply (create or update, then configure and check the cluster), destroy, or plan only
        type: choice
        options: [apply, plan-only, destroy]
        default: apply
      confirm:
        description: For destroy only, type "destroy lab integrations"
        type: string
        default: ""

permissions:
  contents: read

# All lab workflows share one queue on main, so stacks never change under each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('lab-integrations-pr-{0}', github.event.pull_request.number) || 'azure-lab-main' }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: 1.16.5
  KUBELOGIN_VERSION: v0.2.21
  STACK: infra/azure/integrations
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  plan:
    name: Plan
    # Manual Azure Lab runs only: scheduled reaper runs and pull request plans change no cluster
    # this stack must follow (a reaped cluster leaves a federated credential to a dead issuer,
    # which trusts nothing; the next run removes it).
    if: >-
      vars.AZURE_CLIENT_ID != '' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MODE: ${{ inputs.operation == 'destroy' && 'destroy' || 'apply' }}
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
      needs-approval: ${{ steps.plan.outputs.needs-approval }}
      mode: ${{ env.MODE }}
    steps:
      - name: Check the request
        if: env.MODE == 'destroy' && inputs.confirm != 'destroy lab integrations'
        run: |
          echo "::error::Destroy needs confirm = \"destroy lab integrations\"."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Upstream 1: the egress IP the Cloud dev firewall must allow.
      - name: Require the Lab Landing Zone
        if: env.MODE == 'apply'
        uses: ./.github/actions/require-stack
        with:
          stack: infra/azure/landing-zone
          output: egress_ip_address
          workflow: Lab Landing Zone

      # Upstream 2: a manual apply configures a running cluster. After Azure Lab, the plan
      # follows whatever Azure Lab left: a cluster to federate, or none.
      - name: Require the cluster
        if: env.MODE == 'apply' && github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/require-stack
        with:
          stack: infra/azure/cluster
          output: oidc_issuer_url
          workflow: Azure Lab (operation up)

      - name: Plan
        id: plan
        uses: ./.github/actions/terraform-plan
        with:
          stack: ${{ env.STACK }}
          mode: ${{ env.MODE }}
          title: >-
            ${{ format('Lab integrations {0} for {1} ({2})',
                env.MODE == 'destroy' && 'DESTROY plan (removes the lab Key Vault, soft-deleted for 7 days)' || 'plan',
                github.sha, github.actor) }}
          artifact: ${{ github.event_name == 'pull_request' && '' || 'lab-integrations-plan' }}
          approval-free-types: azurerm_federated_identity_credential

  approval:
    name: Approval
    needs: plan
    if: >-
      github.event_name != 'pull_request' && inputs.operation != 'plan-only' &&
      needs.plan.outputs.needs-approval == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download plan summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lab-integrations-plan
          path: reviewed

      - name: Wait for approval
        uses: ./.github/actions/approval
        with:
          approvers: ${{ vars.LAB_APPROVERS || github.actor }}
          title: ${{ format('{0} the lab integrations (run {1})', needs.plan.outputs.mode == 'destroy' && 'Destroy' || 'Create or update', github.run_id) }}
          body-file: reviewed/summary.md

      - name: Close the approval issue of a cancelled run
        if: cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title \
            --jq ".[] | select(.title | endswith(\"(run ${GITHUB_RUN_ID})\")) | .number" |
            xargs -r -I{} gh issue close {} --repo "$GITHUB_REPOSITORY" --comment "Run cancelled; nothing was applied."

  apply:
    name: Apply, configure and check
    needs: [plan, approval]
    # Runs without Azure changes too: it re-applies the cluster wiring and re-runs the checks
    # (for example after DEV_ALLOWED_INGRESS_CIDRS changed).
    if: >-
      !cancelled() && needs.plan.result == 'success' && github.event_name != 'pull_request' &&
      inputs.operation != 'plan-only' &&
      (needs.approval.result == 'success' ||
       (needs.approval.result == 'skipped' && needs.plan.outputs.needs-approval == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      CHANGES: ${{ needs.plan.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download approved plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lab-integrations-plan
          path: reviewed

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Applies the saved plan, never a new one ("Saved plan is stale": run the workflow again).
      - name: Apply the plan
        run: |
          terraform -chdir="${STACK}" init -input=false -backend-config=backend.hcl
          if [ "${CHANGES}" != 0 ]; then
            cp reviewed/plan.tfplan "${STACK}/lab.tfplan"
            terraform -chdir="${STACK}" apply -lock-timeout=5m lab.tfplan
          fi
          {
            if [ "${MODE}" = destroy ]; then echo "### Destroyed the lab integrations"; else echo "### Applied the lab integrations plan"; fi
            echo
            grep -E '^Plan:|^No changes' reviewed/plan.txt || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Read integration outputs
        id: outputs
        if: env.MODE == 'apply'
        run: |
          out() { terraform -chdir="${STACK}" output -raw "$1"; }
          {
            echo "KEY_VAULT_NAME=$(out key_vault_name)"
            echo "AZURE_TENANT_ID=$(out tenant_id)"
            echo "WORKLOAD_CLIENT_ID=$(out workload_client_id)"
            echo "CANARY_SECRET_NAME=$(out canary_secret_name)"
            echo "CANARY_SECRET_VALUE=$(out canary_secret_value)"
            echo "CLOUD_API_URL=$(out cloud_api_url)"
            echo "EGRESS_IP=$(out egress_ip_address)"
          } >> "$GITHUB_ENV"
          echo "cluster=$(out cluster_federated)" >> "$GITHUB_OUTPUT"

      - name: No cluster to configure
        if: env.MODE == 'apply' && steps.outputs.outputs.cluster != 'true'
        run: |
          echo "### The lab cluster is down: Key Vault kept, no cluster federated" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign in to Azure
        if: steps.outputs.outputs.cluster == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubelogin
        if: steps.outputs.outputs.cluster == 'true'
        uses: azure/use-kubelogin@0ce7c36141aa27d4934872cf00b0120804c98a29 # v1.3
        with:
          kubelogin-version: ${{ env.KUBELOGIN_VERSION }}

      - name: Connect to the cluster
        if: steps.outputs.outputs.cluster == 'true'
        run: |
          terraform -chdir=infra/azure/cluster init -input=false -backend-config=backend.hcl >/dev/null
          rg=$(terraform -chdir=infra/azure/cluster output -raw resource_group_name)
          cluster=$(terraform -chdir=infra/azure/cluster output -raw cluster_name)
          az aks get-credentials --resource-group "${rg}" --name "${cluster}" --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
          echo "KUBE_CONTEXT=${cluster}" >> "$GITHUB_ENV"

      # Service account, SecretProviderClass, then the check Job: the canary from Key Vault and
      # Kavrynt Cloud dev through the egress IP.
      - name: Configure and check the cluster
        if: steps.outputs.outputs.cluster == 'true'
        env:
          TARGET: aks
        run: bash scripts/lab.sh integrations

      - name: Summary
        if: always() && steps.outputs.outputs.cluster == 'true'
        env:
          RESULT: ${{ job.status }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Lab integrations: ${RESULT}

          | | |
          |---|---|
          | Key Vault | \`${KEY_VAULT_NAME}\` (kavrynt-platform-admins manage its secrets) |
          | Workload identity | service account \`lab-agents/lab-workload\`, client ID \`${WORKLOAD_CLIENT_ID}\` |
          | Egress IP | \`${EGRESS_IP}\`: must be in kavrynt-platform's \`DEV_ALLOWED_INGRESS_CIDRS\` |
          | Kavrynt Cloud dev | ${CLOUD_API_URL} |

          A failed Cloud dev check with 403 means the firewall does not allow the egress IP yet
          (docs/runbooks/azure-setup.md, step 6). Run this workflow again after fixing it.
          EOF

      - name: Diagnostics
        if: failure() && env.KUBE_CONTEXT != ''
        run: |
          kubectl --context "${KUBE_CONTEXT}" -n lab-agents get serviceaccount,secretproviderclass,jobs,pods || true
          kubectl --context "${KUBE_CONTEXT}" -n lab-agents get events --sort-by=.lastTimestamp | tail -30 || true
          kubectl --context "${KUBE_CONTEXT}" -n kube-system logs -l app=secrets-store-provider-azure --tail=50 || true
