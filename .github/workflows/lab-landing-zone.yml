name: Lab Landing Zone

# Step 1 of 3 of the Azure lab (docs/runbooks/azure-lab.md): the network the cluster is built
# into, kept across cluster rebuilds (infra/azure/landing-zone: VNet, subnet, NSG, static egress
# IP, AKS control-plane identity; about USD 4 a month).
#   manual run on main, operation "apply"      plan -> approval -> apply
#   manual run on main, operation "destroy"    needs confirm, and the cluster down first
#   manual run on main, operation "plan-only"  plan, nothing applied
#   pull request into main                     plan, read-only (shown on the run)
#
# Depends on kavrynt-platform's landing zone (landing-zone/lab.tf): rg-kavrynt-lab, its budget,
# the state container and this workflow's identity. Next: Azure Lab (the cluster).

on:
  pull_request:
    branches: [main]
    paths:
      - infra/azure/landing-zone/**
      - .github/workflows/lab-landing-zone.yml
      - .github/actions/terraform-plan/**
  workflow_dispatch:
    inputs:
      operation:
        description: apply (create or update), destroy, or plan only
        type: choice
        options: [apply, plan-only, destroy]
        default: apply
      confirm:
        description: For destroy only, type "destroy lab landing zone"
        type: string
        default: ""

permissions:
  contents: read

# All lab workflows share one queue on main, so stacks never change under each other. Never
# cancel in progress: an interrupted apply can leave the state lease held.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('lab-landing-zone-pr-{0}', github.event.pull_request.number) || 'azure-lab-main' }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: 1.16.5
  STACK: infra/azure/landing-zone
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  plan:
    name: Plan
    # Federated credentials trust main and pull requests only.
    if: >-
      vars.AZURE_CLIENT_ID != '' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MODE: ${{ inputs.operation == 'destroy' && 'destroy' || 'apply' }}
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
      mode: ${{ env.MODE }}
    steps:
      - name: Check the request
        if: env.MODE == 'destroy' && inputs.confirm != 'destroy lab landing zone'
        run: |
          echo "::error::Destroy needs confirm = \"destroy lab landing zone\"."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Upstream: the resource group and this identity's roles come from kavrynt-platform.
      - name: Require kavrynt-platform's lab foundations
        run: |
          rg=$(sed -n 's/^resource_group_name *= *"\([^"]*\)".*/\1/p' "${STACK}/terraform.tfvars")
          if ! az group show --name "${rg}" --query name -o tsv >/dev/null; then
            {
              echo "### Blocked: ${rg} is missing, or this identity has no role on it"
              echo
              echo "Apply kavrynt-platform's Landing Zone (landing-zone/lab.tf) first: docs/runbooks/azure-setup.md."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${rg} is missing or not accessible. Apply kavrynt-platform's Landing Zone first."
            exit 1
          fi

      # Downstream: the cluster is built into this network and uses its identity and egress IP.
      - name: Require the cluster to be down
        if: env.MODE == 'destroy'
        run: |
          rg=$(sed -n 's/^resource_group_name *= *"\([^"]*\)".*/\1/p' "${STACK}/terraform.tfvars")
          clusters=$(az aks list --resource-group "${rg}" --query "length(@)" -o tsv)
          if [ "${clusters}" -ne 0 ]; then
            echo "::error::A cluster still runs in ${rg}. Run Azure Lab with operation down first."
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Plan
        id: plan
        uses: ./.github/actions/terraform-plan
        with:
          stack: ${{ env.STACK }}
          mode: ${{ env.MODE }}
          title: ${{ format('Lab landing zone {0} for {1} ({2})', env.MODE == 'destroy' && 'DESTROY plan' || 'plan', github.sha, github.actor) }}
          artifact: ${{ github.event_name == 'pull_request' && '' || 'lab-landing-zone-plan' }}

  approval:
    name: Approval
    needs: plan
    # The landing zone persists and the cluster depends on it: every change waits for a person.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.operation != 'plan-only' &&
      needs.plan.outputs.changes != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download plan summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lab-landing-zone-plan
          path: reviewed

      - name: Wait for approval
        uses: ./.github/actions/approval
        with:
          approvers: ${{ vars.LAB_APPROVERS || github.actor }}
          title: ${{ format('{0} the lab landing zone (run {1})', needs.plan.outputs.mode == 'destroy' && 'Destroy' || 'Create or update', github.run_id) }}
          body-file: reviewed/summary.md

      - name: Close the approval issue of a cancelled run
        if: cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title \
            --jq ".[] | select(.title | endswith(\"(run ${GITHUB_RUN_ID})\")) | .number" |
            xargs -r -I{} gh issue close {} --repo "$GITHUB_REPOSITORY" --comment "Run cancelled; nothing was applied."

  apply:
    name: Apply
    needs: [plan, approval]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.approval.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download approved plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lab-landing-zone-plan
          path: reviewed

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Applies the saved plan, never a new one ("Saved plan is stale": run the workflow again).
      - name: Apply the plan
        run: |
          terraform -chdir="${STACK}" init -input=false -backend-config=backend.hcl
          cp reviewed/plan.tfplan "${STACK}/lab.tfplan"
          terraform -chdir="${STACK}" apply -lock-timeout=5m lab.tfplan

      - name: What next
        env:
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          if [ "${MODE}" = destroy ]; then
            echo "### Destroyed the lab landing zone" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ip=$(terraform -chdir="${STACK}" output -raw egress_ip_address)
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### The lab landing zone is applied

          The lab's egress IP is **${ip}**. Kavrynt Cloud dev only accepts listed IPs: add
          \`${ip}/32\` to kavrynt-platform's \`DEV_ALLOWED_INGRESS_CIDRS\` and run its Dev
          Environment workflow (docs/runbooks/azure-setup.md, step 6). It stays the same until
          this landing zone is destroyed.

          Next: run **Azure Lab** with operation **up**.
          EOF
