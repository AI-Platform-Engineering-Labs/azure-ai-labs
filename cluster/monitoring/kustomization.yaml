apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lab-monitoring
resources:
  - namespace.yaml
  - prometheus.yaml
  - grafana.yaml
configMapGenerator:
  - name: prometheus-config
    files: [prometheus.yml]
  - name: grafana-provisioning
    files: [grafana/datasources.yaml, grafana/dashboards.yaml]
  - name: grafana-dashboards
    files: [dashboards/governance.json]
